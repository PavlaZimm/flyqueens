<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FlyQueens — co právě letí nad tebou?</title>
  <desc id="desc">Náhled živé mapy letadel FlyQueens v tmavě modrém a zlatém designu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="0.55" stop-color="#09111d"/>
      <stop offset="1" stop-color="#101a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4fe0b0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4fe0b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.46" stop-color="#5aa9ff"/>
      <stop offset="0.47" stop-color="#f5b83d"/>
      <stop offset="1" stop-color="#f5b83d"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#38506e" stroke-opacity="0.24" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="planeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#f5b83d" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="985" cy="125" r="340" fill="url(#glow)"/>
  <path d="M0 584C280 520 444 608 690 552S1000 455 1200 500V630H0Z" fill="#132238" fill-opacity="0.42"/>

  <!-- Brand -->
  <g transform="translate(70 58)">
    <rect width="64" height="64" rx="16" fill="#f5b83d"/>
    <path d="M32 13l5.4 12.4H26.6L32 13Z" fill="#05080d"/>
    <path d="m18.5 22.5 6.2 12.9-11.3-3.6 5.1-9.3ZM45.5 22.5l5.1 9.3-11.3 3.6 6.2-12.9Z" fill="#05080d"/>
    <rect x="13" y="42" width="38" height="7" rx="3.5" fill="#05080d"/>
    <text x="82" y="38" fill="#e9eef6" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">Fly<tspan fill="#f5b83d">Queens</tspan></text>
    <text x="84" y="58" fill="#8698b0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="4">LIVE AIR TRAFFIC</text>
  </g>

  <!-- Message -->
  <g transform="translate(70 182)">
    <rect width="174" height="30" rx="15" fill="#4fe0b0" fill-opacity="0.1" stroke="#4fe0b0" stroke-opacity="0.35"/>
    <circle cx="18" cy="15" r="4" fill="#4fe0b0"/>
    <text x="31" y="20" fill="#4fe0b0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ŽIVÁ ADS-B DATA</text>

    <text x="0" y="106" fill="#f5f7fa" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.2">Co právě letí</text>
    <text x="0" y="174" fill="#f5f7fa" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.2">nad <tspan fill="#f5b83d">tebou?</tspan></text>
    <text x="2" y="224" fill="#a8b6c9" font-family="Arial, Helvetica, sans-serif" font-size="21">Živá mapa letadel nad Českem a okolím.</text>

    <g transform="translate(0 270)">
      <rect width="220" height="48" rx="12" fill="#f5b83d"/>
      <text x="24" y="31" fill="#09111d" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">OTEVŘÍT ŽIVÝ RADAR</text>
    </g>
  </g>

  <!-- Radar preview -->
  <g transform="translate(650 52)" filter="url(#shadow)">
    <rect width="500" height="526" rx="24" fill="#07101c" stroke="#2c405c" stroke-width="2"/>
    <clipPath id="radarClip"><rect width="500" height="526" rx="24"/></clipPath>
    <g clip-path="url(#radarClip)">
      <rect width="500" height="526" fill="url(#grid)"/>
      <circle cx="294" cy="276" r="110" fill="none" stroke="#4fe0b0" stroke-opacity="0.13"/>
      <circle cx="294" cy="276" r="190" fill="none" stroke="#4fe0b0" stroke-opacity="0.08"/>
      <path d="M-25 454C92 392 179 344 274 270S414 139 534 102" fill="none" stroke="url(#route)" stroke-width="4" stroke-dasharray="12 11" stroke-linecap="round"/>

      <!-- Other aircraft -->
      <g fill="#71849d" opacity="0.78">
        <path transform="translate(95 128) rotate(32) scale(.62)" d="M0-22 5-5l20 10v6L5 8 2 24h-4L-5 8l-20 3V5l20-10 5-17Z"/>
        <path transform="translate(408 196) rotate(-24) scale(.58)" d="M0-22 5-5l20 10v6L5 8 2 24h-4L-5 8l-20 3V5l20-10 5-17Z"/>
        <path transform="translate(176 430) rotate(62) scale(.56)" d="M0-22 5-5l20 10v6L5 8 2 24h-4L-5 8l-20 3V5l20-10 5-17Z"/>
      </g>

      <!-- Selected aircraft -->
      <circle cx="274" cy="270" r="28" fill="#f5b83d" fill-opacity="0.11"/>
      <g transform="translate(274 270) rotate(43)" fill="#f5b83d" filter="url(#planeGlow)">
        <path d="M0-27 6-6l25 12v7L6 10 3 29h-6L-6 10l-25 3V6l25-12 6-21Z"/>
      </g>
      <g transform="translate(308 244)">
        <rect width="154" height="42" rx="9" fill="#0b1625" stroke="#f5b83d" stroke-opacity="0.7"/>
        <text x="14" y="26" fill="#f5f7fa" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">QS1015</text>
        <text x="82" y="26" fill="#4fe0b0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">FL240</text>
        <text x="126" y="26" fill="#a8b6c9" font-family="Arial, Helvetica, sans-serif" font-size="11">486</text>
      </g>

      <!-- Airport labels -->
      <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
        <g transform="translate(44 390)"><rect width="92" height="32" rx="8" fill="#0b1625" stroke="#5aa9ff" stroke-opacity="0.6"/><text x="16" y="21" fill="#b9c6d7">PRG</text></g>
        <g transform="translate(390 91)"><rect width="82" height="32" rx="8" fill="#0b1625" stroke="#f5b83d" stroke-opacity="0.65"/><text x="16" y="21" fill="#f5b83d">AMS</text></g>
      </g>

      <g transform="translate(22 20)">
        <rect width="122" height="32" rx="16" fill="#4fe0b0" fill-opacity="0.1" stroke="#4fe0b0" stroke-opacity="0.3"/>
        <circle cx="17" cy="16" r="4" fill="#4fe0b0"/>
        <text x="30" y="21" fill="#4fe0b0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">LIVE MAPA</text>
      </g>
    </g>
  </g>

  <text x="72" y="596" fill="#66778e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6">FLYQUEENS.CZ</text>
  <rect x="0" y="626" width="1200" height="4" fill="url(#route)"/>
</svg>
